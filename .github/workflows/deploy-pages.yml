name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site in _site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/data

          cp index.html _site/index.html
          cp cooperatives.html _site/cooperatives.html
          cp data/cooperatives.js _site/data/cooperatives.js
          touch _site/.nojekyll

          test "$(find _site -type f | wc -l)" -eq 4
          test -f _site/index.html
          test -f _site/cooperatives.html
          test -f _site/data/cooperatives.js
          test -f _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4